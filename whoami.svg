<svg xmlns="http://www.w3.org/2000/svg" width="480" height="180" viewBox="0 0 480 180">
  <defs>
    <style>
      @font-face {
        font-family: "FiraCodeRetina";
        src: url("data:font/truetype;base64,") format("truetype");
        font-weight: 400;
        font-style: normal;
      }
      .mono {
        font-family: "FiraCodeRetina", "Fira Code", monospace;
        font-size: 13px;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- background -->
  <rect width="480" height="180" rx="10" fill="#0d1117"/>

  <!-- terminal header -->
  <rect width="480" height="40" rx="10" fill="#161b22"/>
  <rect y="20" width="480" height="20" fill="#161b22"/>
  <line x1="0" y1="40" x2="480" y2="40" stroke="#30363d" stroke-width="1"/>

  <!-- traffic lights -->
  <circle cx="22" cy="20" r="5.5" fill="#ff5f57"/>
  <circle cx="42" cy="20" r="5.5" fill="#febc2e"/>
  <circle cx="62" cy="20" r="5.5" fill="#28c840"/>

  <!-- content -->
  <text class="mono" fill="#58a6ff" x="24" y="64">&gt; whoami</text>
  <text class="mono" fill="#c9d1d9" x="24" y="86">sudhanshu shekhar singh</text>
  <text class="mono" fill="#8b949e" x="24" y="108">backend / frontend / fullstack</text>
  <text class="mono" fill="#58a6ff" x="24" y="132">&gt; skills</text>
  <text class="mono" fill="#c9d1d9" x="24" y="154">java &#183; spring &#183; redis &#183; kafka &#183; docker &#183; react</text>
</svg>